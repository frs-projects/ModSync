# ── Gradle ──────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true
# Loom's remap/decompile tasks are not configuration-cache safe.
org.gradle.configuration-cache=false

# ── Mod identity ────────────────────────────────────────────────────────────
mod.id=modsync
mod.name=ModSync
mod.group=net.frsprojects.modsync
mod.version=0.1.2
mod.license=LGPL-3.0-only
mod.description=Synchronises a client's mods folder with what the server requires.
mod.authors=Rustypredator
mod.source=https://github.com/Rustypredator/ModSync

# ── Toolchain ───────────────────────────────────────────────────────────────
# :core targets the lowest Java in the matrix (1.20.1 runs on Java 17).
core.java=17
